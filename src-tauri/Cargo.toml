[package]
name = "ghostline"
version = "0.1.0"
description = "Defensive security toolkit for your own devices and network"
edition = "2021"

# The app's Rust code lives in a library (src/lib.rs) so the same code can be
# reused later (tests, mobile). src/main.rs just calls into it.
[lib]
name = "ghostline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gethostname = "1"
