[package]
name = "kyn"
version = "0.2.1"
description = "Defensive security toolkit for your own devices and network"
edition = "2021"

# The app's Rust code lives in a library (src/lib.rs) so the same code can be
# reused later (tests, mobile). src/main.rs just calls into it.
[lib]
name = "kyn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gethostname = "1"
# Network Map
netdev = "0.48"          # network interfaces, subnet, default gateway
mdns-sd = "0.22"         # Bonjour / mDNS: names and device types
dns-lookup = "4"         # reverse DNS (IP -> name) via your router
futures = "0.3"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt", "process"] }
# Auto-updates (desktop only)
tauri-plugin-updater = "2"
# Traffic Monitor: offline IP location / owner lookup
maxminddb = "0.33"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
base64 = "0.21"
# OPS: "is someone reading my HTTPS?" compares the system's trusted certificates
# with Mozilla's public list
webpki-roots = "1"
